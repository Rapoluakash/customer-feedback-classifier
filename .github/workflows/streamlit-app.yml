name: Streamlit App CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test-streamlit:
    runs-on: ubuntu-latest

    steps:
      - name: ⬇️ Checkout code
        uses: actions/checkout@v3

      - name: 🐍 Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: 3.10  # Use a stable Python version like 3.10

      - name: 📦 Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: ✅ Test Streamlit app (headless)
        run: |
          streamlit run customer_feedback_analysis.py --server.headless true &
          sleep 15
          pkill streamlit
